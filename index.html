<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabbit Breeds</title>
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --art-bg: #f3ece2;
    --text: #2b2624;
    --muted: #7a706b;
    --accent: #c2725b;
    --accent-soft: #f6e6df;
    --border: #e8e1da;
    --shadow: 0 2px 10px rgba(0,0,0,0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1816;
      --surface: #242120;
      --art-bg: #2f2a27;
      --text: #f1ebe6;
      --muted: #a39a94;
      --accent: #e08f78;
      --accent-soft: #3a2b26;
      --border: #3a3431;
      --shadow: 0 2px 10px rgba(0,0,0,0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1816;
    --surface: #242120;
    --art-bg: #2f2a27;
    --text: #f1ebe6;
    --muted: #a39a94;
    --accent: #e08f78;
    --accent-soft: #3a2b26;
    --border: #3a3431;
    --shadow: 0 2px 10px rgba(0,0,0,0.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header, .controls, .count, main { max-width: 1100px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
  header { padding-top: 32px; padding-bottom: 8px; }
  h1 { margin: 0 0 4px; font-size: 1.9rem; }
  .subtitle { margin: 0; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; }
  .search {
    flex: 1 1 260px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .count { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
  main { padding-top: 12px; padding-bottom: 48px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 12px 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .card .art { border-radius: 10px; overflow: hidden; background: var(--art-bg); }
  .card .art svg { display: block; width: 100%; height: auto; }
  .card h2 { margin: 6px 4px 0; font-size: 1.1rem; }
  .card .origin { color: var(--muted); font-size: 0.85rem; margin: 0 4px; }
  .tag {
    display: inline-block;
    align-self: flex-start;
    margin: 0 4px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  img.photo { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    color: var(--text);
    border-radius: 16px;
    max-width: 680px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 22px;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .close {
    position: absolute; top: 12px; right: 12px;
    background: var(--accent-soft); border: none; color: var(--accent);
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 1.2rem; cursor: pointer; z-index: 2;
  }
  .hero { border-radius: 12px; overflow: hidden; background: var(--art-bg); }
  .hero svg { display: block; width: 100%; height: auto; }
  .modal h2 { margin: 14px 0 2px; font-size: 1.6rem; }
  .origin-line { color: var(--muted); margin: 0 0 10px; }
  .lead { margin: 0 0 16px; }
  .section { margin-top: 18px; }
  .section h3 {
    margin: 0 0 8px; font-size: 1rem; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .section p { margin: 0 0 8px; }
  dl.facts {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0;
  }
  dl.facts div {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  dl.facts dt { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  dl.facts dd { margin: 2px 0 0; font-weight: 600; }
  ul.list { margin: 0; padding-left: 18px; }
  ul.list li { margin-bottom: 4px; }
  .disclaimer { color: var(--muted); font-size: 0.8rem; margin-top: 20px; }

  @media (max-width: 520px) { dl.facts { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>Rabbit Breeds</h1>
  <p class="subtitle">Browse common rabbit breeds and tap any one for its full profile.</p>
</header>

<div class="controls">
  <input id="search" class="search" type="search" placeholder="Search by name, origin or use…" aria-label="Search breeds">
  <div class="filters" role="group" aria-label="Filter by size">
    <button class="chip" data-size="All" aria-pressed="true">All</button>
    <button class="chip" data-size="Dwarf" aria-pressed="false">Dwarf</button>
    <button class="chip" data-size="Medium" aria-pressed="false">Medium</button>
    <button class="chip" data-size="Large" aria-pressed="false">Large</button>
  </div>
</div>
<div class="count" id="count"></div>

<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>No breeds match your search.</div>
</main>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal">
    <button class="close" id="close" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

  // ---------- Illustration generator ----------
  function rabbitSVG(b, idx) {
    const a = b.art;
    const s = a.s;
    const hx = 142, hy = 80, R = 22 * s;
    const bodyX = 100, bodyY = 112, bodyRx = 44 * s, bodyRy = 30 * s;
    const gid = "clip" + idx;

    // shape of body + head + ears, filled with the given colour
    function shape(fill, pointFill) {
      let g = "";
      // ears
      if (a.ears === "lop") {
        g += `<ellipse cx="${hx - R * 0.55}" cy="${hy - R * 0.2}" rx="${7 * s}" ry="${22 * s}" transform="rotate(-18 ${hx - R * 0.55} ${hy - R * 0.2})" fill="${pointFill}"/>`;
        g += `<ellipse cx="${hx + R * 0.45}" cy="${hy - R * 0.25}" rx="${7 * s}" ry="${21 * s}" transform="rotate(14 ${hx + R * 0.45} ${hy - R * 0.25})" fill="${pointFill}"/>`;
      } else {
        g += `<ellipse cx="${hx - 8 * s}" cy="${hy - R - 8 * s}" rx="${7 * s}" ry="${22 * s}" fill="${pointFill}"/>`;
        g += `<ellipse cx="${hx + 8 * s}" cy="${hy - R - 8 * s}" rx="${7 * s}" ry="${22 * s}" fill="${pointFill}"/>`;
      }
      // woolly fringe on body
      if (a.woolly) {
        for (let i = 0; i < 16; i++) {
          const t = (i / 16) * Math.PI * 2;
          const x = bodyX + Math.cos(t) * bodyRx * 0.98;
          const y = bodyY + Math.sin(t) * bodyRy * 0.98;
          g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(5.5 * s).toFixed(1)}" fill="${fill}"/>`;
        }
      }
      // body and head
      g += `<ellipse cx="${bodyX}" cy="${bodyY}" rx="${bodyRx}" ry="${bodyRy}" fill="${fill}"/>`;
      // lionhead mane
      if (a.mane) {
        for (let i = 0; i < 14; i++) {
          const t = (i / 14) * Math.PI * 2;
          const x = hx + Math.cos(t) * (R + 2);
          const y = hy + Math.sin(t) * (R + 2);
          g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(8 * s).toFixed(1)}" fill="${a.mane}"/>`;
        }
      }
      g += `<circle cx="${hx}" cy="${hy}" r="${R}" fill="${fill}"/>`;
      return g;
    }

    let out = `<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a ${b.name} rabbit">`;
    out += `<rect width="200" height="160" fill="var(--art-bg)"/>`;
    out += `<ellipse cx="100" cy="146" rx="62" ry="5" fill="#000" opacity="0.12"/>`;
    // tail and back legs
    out += `<circle cx="${bodyX - bodyRx + 4}" cy="${bodyY - 4}" r="${7 * s}" fill="${a.p}"/>`;
    out += `<ellipse cx="${bodyX - 22 * s}" cy="${bodyY + bodyRy - 4}" rx="${10 * s}" ry="${6 * s}" fill="${a.p}"/>`;
    out += `<ellipse cx="${bodyX + 22 * s}" cy="${bodyY + bodyRy - 4}" rx="${10 * s}" ry="${6 * s}" fill="${a.p}"/>`;

    out += shape(a.c, a.p);

    // split colour (Harlequin): repaint the right half with the second colour
    if (a.split) {
      out += `<defs><clipPath id="${gid}"><rect x="100" y="0" width="100" height="160"/></clipPath></defs>`;
      out += `<g clip-path="url(#${gid})">${shape(a.p, a.p)}</g>`;
    }

    // front legs
    out += `<ellipse cx="${bodyX + 30 * s}" cy="${bodyY + bodyRy - 2}" rx="${6 * s}" ry="${8 * s}" fill="${a.p}"/>`;
    // nose
    out += `<circle cx="${hx + R * 0.95}" cy="${hy + R * 0.2}" r="${2.4 * s}" fill="${a.p}"/>`;
    // eye
    const ex = hx + R * 0.35, ey = hy - R * 0.2;
    if (a.eyeRing) {
      out += `<circle cx="${ex}" cy="${ey}" r="${6.5 * s}" fill="none" stroke="#2b2624" stroke-width="2.2"/>`;
    }
    out += `<circle cx="${ex}" cy="${ey}" r="${2.4 * s}" fill="#1a1816"/>`;
    out += `<circle cx="${ex + 0.8}" cy="${ey - 0.8}" r="0.7" fill="#fff"/>`;
    out += `</svg>`;
    return out;
  }

  function breedArt(b, idx, cls) {
    if (b.photo) {
      return `<img class="${cls}" src="${b.photo}" alt="Photo of a ${b.name} rabbit" loading="lazy">`;
    }
    return rabbitSVG(b, idx);
  }

  const searchInput = document.getElementById("search");
  const overlay = document.getElementById("overlay");
  const modalBody = document.getElementById("modal-body");
  const closeBtn = document.getElementById("close");

  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function matches(b) {
    const sizeOk = activeSize === "All" || b.size === activeSize;
    const q = query.trim().toLowerCase();
    const hay = [b.name, b.origin, b.facts.Coat, b.facts.Temperament, b.facts["Commonly used for"], b.lead].join(" ").toLowerCase();
    return sizeOk && (!q || hay.includes(q));
  }

  function render() {
    const list = BREEDS.map((b, i) => ({ b, i })).filter(x => matches(x.b));
    grid.innerHTML = "";
    list.forEach(({ b, i }) => {
      const card = document.createElement("button");
      card.className = "card";
      card.type = "button";
      card.innerHTML = `
        <div class="art">${breedArt(b, i, "photo")}</div>
        <h2>${esc(b.name)}</h2>
        <div class="origin">${esc(b.origin)}</div>
        <span class="tag">${esc(b.size)}</span>`;
      card.addEventListener("click", () => openModal(i));
      grid.appendChild(card);
    });
    empty.hidden = list.length !== 0;
    count.textContent = `Showing ${list.length} of ${BREEDS.length} breeds`;
  }

  function section(title, html) {
    return `<div class="section"><h3>${title}</h3>${html}</div>`;
  }

  function openModal(idx) {
    const b = BREEDS[idx];
    const factsHtml = Object.entries(b.facts)
      .map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
    const careHtml = Object.entries(b.care)
      .map(([k, v]) => `<p><strong>${esc(k)}:</strong> ${esc(v)}</p>`).join("");
    const healthHtml = `<ul class="list">${b.health.map(h => `<li>${esc(h)}</li>`).join("")}</ul>`;

    modalBody.innerHTML = `
      <div class="hero">${breedArt(b, idx, "photo")}</div>
      <h2 id="modal-title">${esc(b.name)}</h2>
      <p class="origin-line">Origin: ${esc(b.origin)}</p>
      <p class="lead">${esc(b.lead)}</p>
      ${section("Quick facts", `<dl class="facts">${factsHtml}</dl>`)}
      ${section("About the breed", `<p>${esc(b.about)}</p>`)}
      ${section("Appearance", `<p>${esc(b.appearance)}</p>`)}
      ${section("Temperament", `<p>${esc(b.temperament)}</p>`)}
      ${section("Care", careHtml)}
      ${section("Common health concerns", healthHtml)}
      ${section("Best suited for", `<p>${esc(b.bestFor)}</p>`)}
      ${section("May not suit", `<p>${esc(b.notIdeal)}</p>`)}
      <p class="disclaimer">Illustrations are stylised, not photographs. Figures are approximate and vary by source and individual rabbit. Consult a veterinarian for health and care decisions.</p>
    `;
    overlay.classList.add("open");
    closeBtn.focus();
  }

  function closeModal() { overlay.classList.remove("open"); }
  closeBtn.addEventListener("click", closeModal);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  searchInput.addEventListener("input", e => { query = e.target.value; render(); });

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeSize = chip.dataset.size;
      document.querySelectorAll(".chip").forEach(c =>
        c.setAttribute("aria-pressed", c === chip ? "true" : "false"));
      render();
    });
  });

  render();
</script>
</body>
</html>
